# Dev environment overrides for the n8n workflow automation chart.

# Keep one replica in dev because this is a single-node K3s cluster.
replicaCount: 1

# Use a stable resource name for internal DNS and ingress routing.
fullnameOverride: devorecruiter-n8n

# Pin the public n8n stable image to the reviewed OCI index digest.
image:
  repository: n8nio/n8n
  tag: "stable"
  digest: "sha256:15091606d98f6d15bad10cb26bb937ccb47dfd9fee2bb7ae44c7061cba2e7a04"
  pullPolicy: IfNotPresent

# n8n runs against the existing in-cluster PostgreSQL service with its own database.
env:
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "devorecruiter"
  GENERIC_TIMEZONE: "Africa/Tunis"
  TZ: "Africa/Tunis"
  N8N_HOST: "n8n.devorecruiter.local"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_EDITOR_BASE_URL: "http://localhost:5678"
  N8N_WEBHOOK_URL: "http://n8n.devorecruiter.local/"
  N8N_LOG_LEVEL: "info"
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
  N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"

# Secret name and key expected to exist in the dev namespace before Argo sync.
secretEnv:
  existingSecret: devorecruiter-n8n-secrets
  required:
    N8N_ENCRYPTION_KEY: n8n-encryption-key
  optional:
    OPENROUTER_API_KEY: openrouter-api-key
    CONVERTAPI_SECRET: convertapi-secret
    GOOGLE_DRIVE_FOLDER_URL: google-drive-folder-url
    GOOGLE_GEMINI_API_KEY: google-gemini-api-key
    GOOGLE_CLIENT_ID: google-client-id
    GOOGLE_CLIENT_SECRET: google-client-secret
    WEBHOOK_SECRET: webhook-secret
    CV_ALERT_EMAIL: cv-alert-email
    BACKEND_CV_UPDATE_WEBHOOK_URL: backend-cv-update-webhook-url

# Reuse the existing Postgres password Secret and create the n8n DB idempotently.
database:
  host: postgres
  port: 5432
  name: n8n
  user: devorecruiter
  passwordSecret: devorecruiter-postgres-secrets
  passwordKey: postgres-password
  init:
    enabled: true
    image:
      repository: cgr.dev/chainguard/postgres
      tag: "latest"
      digest: "sha256:833bd9897f70176303e5a9347bdfb4596272176523b3d205dbad93e4adb62227"
      pullPolicy: IfNotPresent
    backoffLimit: 3
    ttlSecondsAfterFinished: 300

# Preserve n8n local files on the Azure VM local-path volume.
persistence:
  enabled: true
  mountPath: /home/node/.n8n
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  storageClassName: local-path

# Expose n8n through Traefik at a local development hostname.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: n8n.devorecruiter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Keep n8n within the available capacity of the 4 GiB VM.
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi
