# Dev environment overrides for the Angular/nginx frontend chart.

# Keep one replica in dev to reduce local or small-cluster resource usage.
replicaCount: 1

# Pin the frontend image to the source commit built by CI.
image:
  repository: benharbfarah/devorecruiter-front
  tag: "3cb054146a327d87e7c932dd05bd0fa405e838c2"
  pullPolicy: IfNotPresent

# The Docker Hub repository is public, so no registry credentials are required.
imagePullSecrets: []

# The frontend nginx container proxies /api requests to the internal BFF Service.
env:
  BFF_UPSTREAM: "http://devorecruiter-api-bff:3000"

# Expose only the frontend by default in dev.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: devorecruiter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Nginx serves static assets and needs only a small resource allocation.
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
