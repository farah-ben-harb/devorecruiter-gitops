# Dev environment overrides for the NestJS BFF chart.

# Keep one replica in dev because the app depends on shared services and secrets.
replicaCount: 1

# Keep the in-cluster DNS name stable because the frontend proxies to this Service.
fullnameOverride: devorecruiter-api-bff

# Pin the BFF image to the source commit built by CI.
image:
  repository: benharbfarah/devorecruiter-api-bff
  tag: "3cb054146a327d87e7c932dd05bd0fa405e838c2"
  pullPolicy: IfNotPresent

# The Docker Hub repository is public, so no registry credentials are required.
imagePullSecrets: []

# Non-secret dev configuration. Real secret values stay in Kubernetes Secrets.
env:
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ORIGIN: "http://localhost:4200"
  FRONTEND_URL: "http://localhost:4200"
  APP_FRONTEND_URL: "http://localhost:4200"
  AUTH_CALLBACK_INCLUDE_ACCESS_TOKEN_QUERY: "true"
  AUTH_COOKIE_SAMESITE: "lax"
  AUTH_COOKIE_SECURE: "false"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_USER: "devorecruiter"
  DATABASE_NAME: "devorecruiter"
  DATABASE_SYNCHRONIZE: "false"
  GOOGLE_CALLBACK_URL: "http://localhost:3000/auth/google/callback"
  FASTAPI_BASE_URL: "http://devorecruiter-api-back:8000"
  N8N_TIMEOUT_MS: "30000"
  N8N_SCORING_CV_MIN_SCORE: "70"
  N8N_SCORING_JOB_POST_MIN_SCORE: "70"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"

# Secret names and keys expected to exist in the dev namespace.
secretEnv:
  existingSecret: devorecruiter-api-bff-secrets
  required:
    DATABASE_PASSWORD: database-password
    JWT_SECRET: jwt-secret
    JWT_REFRESH_SECRET: jwt-refresh-secret
    GOOGLE_CLIENT_ID: google-client-id
    GOOGLE_CLIENT_SECRET: google-client-secret
    GITHUB_TOKEN: github-token
    GROQ_API_KEY: groq-api-key
    N8N_WEBHOOK_URL: n8n-webhook-url
  optional:
    DRIVE_FOLDER_CANDIDATES_CVS_BRUTS: drive-folder-candidates-cvs-bruts
    DRIVE_FOLDER_CANDIDATES_CVS_UNIFIES: drive-folder-candidates-cvs-unifies
    DRIVE_FOLDER_EVALUATIONS_ID: drive-folder-evaluations-id
    DRIVE_FOLDER_JOB_POSTS_ID: drive-folder-job-posts-id
    DRIVE_FOLDER_UNIFIED_ID: drive-folder-unified-id
    EMAIL_PASS: email-pass
    EMAIL_USER: email-user
    GITHUB_USERNAME: github-username
    GOOGLE_DRIVE_REFRESH_TOKEN: google-drive-refresh-token
    GOOGLE_DRIVE_RESULT_FOLDER_ID: google-drive-result-folder-id
    GOOGLE_GEMINI_API_KEY: google-gemini-api-key
    GOOGLE_SERVICE_ACCOUNT_EMAIL: google-service-account-email
    GOOGLE_SERVICE_ACCOUNT_KEY: google-service-account-key
    GOOGLE_VISION_API_KEY: google-vision-api-key
    N8N_BASE_URL: n8n-base-url
    N8N_SCORING_CV_WEBHOOK_URL: n8n-scoring-cv-webhook-url
    N8N_SCORING_WEBHOOK_URL: n8n-scoring-webhook-url
    N8N_WEBHOOK_CANDIDATE_CV_UNIFICATION: n8n-webhook-candidate-cv-unification
    N8N_WEBHOOK_PREFIX: n8n-webhook-prefix
    OPENAI_API_KEY: openai-api-key
    OPENROUTER_API_KEY: openrouter-api-key
    WEBHOOK_SECRET: webhook-secret

# BFF remains internal in dev; frontend nginx reaches it through the ClusterIP Service.
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: api.devorecruiter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Bound Chromium and NestJS usage on the shared student VM.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 1Gi

# Keep migrations disabled until the BFF image ships a TypeORM data-source file.
migrations:
  enabled: false
