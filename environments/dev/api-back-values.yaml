# Dev environment overrides for the FastAPI/RAG chart.

# Keep one replica in dev because the service can use local Chroma data.
replicaCount: 1

# Keep the in-cluster DNS name stable because the BFF calls this Service.
fullnameOverride: devorecruiter-api-back

# Pin the FastAPI image to the source commit built by CI.
image:
  repository: benharbfarah/devorecruiter-api-back
  tag: "d4f136e9ff1ddb07aabae4172fc376f7fcd57ca2"
  pullPolicy: IfNotPresent

# The Docker Hub repository is public, so no registry credentials are required.
imagePullSecrets: []

# Non-secret dev configuration. GROQ_API_KEY stays in a Kubernetes Secret.
env:
  ALLOWED_ORIGINS: "http://devorecruiter.local,http://devorecruiter-frontend"
  CHROMA_PERSIST_DIRECTORY: "/data/chroma"
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  GROQ_MODEL: "llama-3.3-70b-versatile"

# Secret name and key expected to exist in the dev namespace.
secretEnv:
  existingSecret: devorecruiter-api-back-secrets
  required:
    GROQ_API_KEY: groq-api-key
  optional: {}

# Preserve Chroma data across Pod restarts on the single-node K3s volume.
persistence:
  enabled: true
  mountPath: /data/chroma
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  storageClassName: local-path

# FastAPI remains internal in dev and is reached by the BFF through ClusterIP.
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: rag.devorecruiter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Keep the ML service within the capacity of the 4 GiB Azure student VM.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
