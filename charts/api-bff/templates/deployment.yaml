# Deployment keeps the desired number of BFF Pods running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devorecruiter-api-bff.fullname" . }}
  labels:
    {{- include "devorecruiter-api-bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devorecruiter-api-bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart BFF Pods automatically when non-secret ConfigMap values change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "devorecruiter-api-bff.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      # podSecurityContext applies security settings to the whole Pod.
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      # imagePullSecrets lets Kubernetes authenticate to Docker Hub when needed.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          # securityContext applies container-level hardening.
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Load non-secret runtime values such as FASTAPI_BASE_URL from the ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ include "devorecruiter-api-bff.fullname" . }}
          # Load required and optional sensitive values from an external Secret.
          env:
            {{- range $name, $key := .Values.secretEnv.required }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretEnv.existingSecret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $name, $key := .Values.secretEnv.optional }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretEnv.existingSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.livenessPath | quote }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.health.readinessPath | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
