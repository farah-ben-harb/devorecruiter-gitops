{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devorecruiter-api-back.fullname" . }}
  labels:
    {{- include "devorecruiter-api-back.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devorecruiter-api-back.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-bff
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
