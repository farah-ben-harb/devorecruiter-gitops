# Number of frontend Pods Kubernetes should keep running.
replicaCount: 1

# Container image published by the application CI pipeline.
image:
  repository: benharbfarah/devorecruiter-front
  tag: "ad1afb5ceb27cfb6245d9defab37dbd27c5cad9f"
  pullPolicy: IfNotPresent

# Secret used by Kubernetes to pull private Docker Hub images.
# If the Docker Hub repository is public, this can be changed to an empty list.
imagePullSecrets:
  - name: dockerhub-registry

# Optional name overrides used when a shorter or fixed Kubernetes resource name is required.
nameOverride: ""
fullnameOverride: ""

# Frontend container and Service networking.
containerPort: 80

service:
  type: ClusterIP
  port: 80
  targetPort: http

# Non-secret runtime configuration passed to the nginx container.
env:
  BFF_UPSTREAM: "http://devorecruiter-api-bff:3000"

# Health endpoints implemented by the frontend nginx configuration.
health:
  livenessPath: /healthz
  readinessPath: /readyz

# Ingress is disabled for Phase 5 because no Kubernetes deployment is performed yet.
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: devorecruiter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests and limits are intentionally empty until cluster sizing is defined.
resources: {}
