# Deployment keeps the desired number of frontend Pods running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devorecruiter-frontend.fullname" . }}
  labels:
    {{- include "devorecruiter-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devorecruiter-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devorecruiter-frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      # imagePullSecrets lets Kubernetes authenticate to Docker Hub when needed.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "devorecruiter-frontend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Load non-secret runtime values such as BFF_UPSTREAM from the ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ include "devorecruiter-frontend.fullname" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.livenessPath | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: {{ .Values.health.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.health.failureThreshold | default 6 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.readinessPath | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ .Values.health.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.health.failureThreshold | default 6 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
