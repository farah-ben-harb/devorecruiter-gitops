# Argo CD server command parameters for the development VM.
# This ConfigMap already exists after Argo CD installation; GitOps now owns the
# specific setting needed to terminate public TLS at the Traefik ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # TLS terminates at Traefik; the in-cluster hop remains HTTP.
  server.insecure: "true"
