# Ingress exposes the Argo CD web UI on the development VM.
# This is intended for local/dev access through argocd.devorecruiter.local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  # Traefik is the default ingress controller installed with K3s.
  ingressClassName: traefik
  rules:
    - host: argocd.devorecruiter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
