apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../argocd/projects/devorecruiter-dev.yaml
  - ../../argocd/applications/postgres-dev.yaml
  - ../../argocd/applications/api-back-dev.yaml
  - ../../argocd/applications/api-bff-dev.yaml
  - ../../argocd/applications/frontend-dev.yaml
  - ../../argocd/applications/n8n-dev.yaml
  - ../../argocd/argocd-cmd-params-cm.yaml
  - ../../argocd/argocd-server-ingress.yaml
  - backend-service-alias.yaml

patches:
  - target:
      kind: Application
      name: devorecruiter-frontend-dev
    patch: |-
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: image.repository
            value: devorecruiter-front
          - name: image.tag
            value: ci-local
          - name: image.pullPolicy
            value: IfNotPresent
          - name: ingress.hosts[0].host
            value: devorecruiter.127.0.0.1.nip.io
          - name: env.BFF_UPSTREAM
            value: http://devorecruiter-api-bff:3000
  - target:
      kind: Application
      name: devorecruiter-api-bff-dev
    patch: |-
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: image.repository
            value: devorecruiter-api-bff
          - name: image.tag
            value: ci-local
          - name: image.pullPolicy
            value: IfNotPresent
          - name: env.CORS_ORIGIN
            value: http://devorecruiter.127.0.0.1.nip.io
          - name: env.FRONTEND_URL
            value: http://devorecruiter.127.0.0.1.nip.io
          - name: env.APP_FRONTEND_URL
            value: http://devorecruiter.127.0.0.1.nip.io
          - name: env.RAG_URL
            value: http://devorecruiter-api-back:8000
          - name: health.livenessPath
            value: /health
          - name: health.readinessPath
            value: /health
          - name: ingress.enabled
            value: "true"
          - name: ingress.hosts[0].host
            value: api.devorecruiter.127.0.0.1.nip.io
  - target:
      kind: Application
      name: devorecruiter-n8n-dev
    patch: |-
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: env.N8N_HOST
            value: n8n.devorecruiter.127.0.0.1.nip.io
          - name: env.N8N_EDITOR_BASE_URL
            value: http://n8n.devorecruiter.127.0.0.1.nip.io
          - name: env.N8N_WEBHOOK_URL
            value: http://n8n.devorecruiter.127.0.0.1.nip.io/
          - name: ingress.hosts[0].host
            value: n8n.devorecruiter.127.0.0.1.nip.io
  - target:
      kind: Ingress
      name: argocd-server
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: argocd.devorecruiter.127.0.0.1.nip.io
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: argocd-server
                    port:
                      number: 80
