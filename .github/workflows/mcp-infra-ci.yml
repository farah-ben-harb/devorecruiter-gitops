name: MCP infrastructure server

on:
  pull_request:
    paths:
      - tools/mcp-infra/**
      - .github/workflows/mcp-infra-ci.yml
  push:
    branches: [main]
    paths:
      - tools/mcp-infra/**
      - .github/workflows/mcp-infra-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mcp-infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
